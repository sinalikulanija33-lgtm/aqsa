<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my love's Birthday</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container" id="container">
        <div class="screen active" id="screen1">
            <div class="balloon_one"></div>
            <div class="balloon_two"></div>
            <div class="balloon_three"></div>
            <div class="balloon_four"></div>
            <div class="balloon_five"></div>

            <h1 class="birthday">
                <span>Dear sosa mala</span>
                <i class="fa-solid fa-heart"></i>
            </h1>

            <div class="btn">
                <button id="btn_letter">
                    <div class="mail">
                        Click Here mge sosa mala 🐾
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </button>
            </div>
        </div>

        <div class="screen" id="screen2">
            <div class="balloon_one"></div>
            <div class="balloon_two"></div>
            <div class="balloon_three"></div>
            <div class="balloon_four"></div>
            <div class="balloon_five"></div>

            <div class="name">
                <i class="fa-solid fa-heart"></i>
                <span>Dear sosa mala</span>
                <i class="fa-solid fa-heart"></i>
            </div>

            <div class="userImg">
                <img src="images/unnamed.png" alt="">
            </div>

            <h4 class="username">To: Mge adree 💖<span class="underline"></span></h4>
            
            <div class="imageCute">
                <img src="images/cutee1.png" alt="" id="cute1">
                <img src="images/cutee2.png" alt="" id="cute2">
            </div>

            <div class="card2">
                <div class="card2-content">
                    <h3>To You!</h3>
                    <h2 id="text_letter" style="font-size: 15px; line-height: 1.4;"></h2>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        var intervalContent;
        $("#btn_letter").on("click", function () {
            setTimeout(function () {
                let datetxt = "27 May";
                let datatxtletter = "Happy Birthday mge sosa mala...ada oyage 18th birthday eka..onn me para nm ape adre lssnt krgen awa neda...me para mn oyage bd ekat 12am hriytm wish kla..mata nm one mechchri,oya hama dwskm godk happy eke inn one, me bd ekath mn laga nh thmi wish krnn, habai mn oya ekk ikmnin dwsk mewa celebrate krnw,edat api godk sthutu wemu,ape dawasa godk lssn kr gmu..oyage me bd eka withrk neme issrht ena hama bd ekkam mn nm oya ekk lginm innw, mn oyata gift ekk gthth,eka dennm meet unama,api meet wena dwst bbage bd ek celebrate krmu. ..me bd eka mge sosa malat godk special,dn nm mge sosa mala godk loku ayiya kenek....dn 18..e unt mge chuti bba thm..mge pna oya..tc, luvu godkkkk 💖";
                
                let combinedText = datetxt + "\n\n" + datatxtletter;
                let container = document.getElementById("text_letter");
                let index = 0;

                intervalContent = setInterval(function () {
                    if (index < combinedText.length) {
                        container.textContent += combinedText[index];
                        index++;
                    } else {
                        clearInterval(intervalContent);
                    }
                }, 50);
            }, 2000);
            
            setTimeout(function () {
                document.getElementById('screen1').classList.remove('active');
                document.getElementById('screen2').classList.add('active');
            }, 1000);
        });
    </script>
</body>
                                                                            </html>
