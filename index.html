<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <div class="screen active" id="screen1">
            <div class="gift-box" onclick="nextScreen()">🎁</div>
            <p class="instruction">Tap the gift box to open!</p>
        </div>

        <div class="screen" id="screen2">
            <div class="decor-left">
                <img src="images/cutee1.png" alt="Decoration Left">
            </div>

            <div class="card2">
                <div class="card2-content">
                    <h4>To: Mge adree 💖</h4>
                    <span id="text-container"></span>
                </div>
            </div>

            <div class="decor-right">
                <img src="images/cutee2.png" alt="Decoration Right">
            </div>
        </div>
    </div>

    <script>
        function nextScreen() {
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
            startTyping();
        }

        function startTyping() {
            // Set dynamic styling to guarantee the text fits perfectly inside the card
            const contentH2 = document.querySelector(".card2-content");
            if (contentH2) {
                contentH2.style.fontSize = "15px";
                contentH2.style.lineHeight = "1.4";
            }

            let datetxt = "27 May";
            let datatxtletter = "Happy Birthday mge sosa mala! 💖 You mean the absolute world to me. I am so incredibly blessed to have you in my life. Every single moment with you is special. I promise to love you, support you, and stand by your side through everything. Cheers to another beautiful year of your life, my love! 🥂✨ Happy Birthday!";
            
            let combinedText = "<h2>" + datetxt + "</h2><p>" + datatxtletter + "</p>";
            let container = document.getElementById("text-container");
            let index = 0;
            let currentHTML = "";

            function typeNextChar() {
                if (index < combinedText.length) {
                    currentHTML += combinedText[index];
                    container.innerHTML = currentHTML;
                    index++;
                    setTimeout(typeNextChar, 30);
                }
            }
            typeNextChar();
        }
    </script>
</body>
</html>
